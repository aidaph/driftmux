[project]
name = "driftmux"
version = "1.1.0"
authors = [
  { name="Aida Palacio Hoz", email="aidaph@ifca.unican.es" },
]
description = "Black-box service discovery, classification, and adaptive scan routing"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["nmap", "nuclei", "plecost", "vulnscan", "wordpress"]
classifiers = [
    "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",

]

dependencies = [
  "click>=8.1",
  "requests>=2.31",
  "rich>=13.7",
  "pyfiglet>=1.0.4",
  "beautifulsoup4>=4.14.3",
  "openstacksdk>=3.0"
]


[build-system]
requires = ["setuptools >= 77.0.3","wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest >=8",
  "pytest-cov>=5",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
include = ["driftmux*"]
exclude = ["tests*", "docs*", "databases*"]

[project.urls]
Homepage = "https://driftmux.readthedocs.io/en/latest/"
Repository = "https://github.com/aidaph/driftmux"
Issues = "https://github.com/aidaph/driftmux/issues"

[project.scripts]
driftmux = "driftmux.cli:main"


